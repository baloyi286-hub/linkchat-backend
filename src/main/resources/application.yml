spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/linkchat
    username: linkchat
    password: linkchat
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB
server:
  port: ${PORT:8080}
app:
  frontend-url: http://localhost:5173
  upload-dir: ${UPLOAD_DIR:uploads}
logging:
  level:
    root: INFO
    com.linkchat: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%thread] %logger{36} - %msg%n"
